<div class="page__footer">
  <footer>
    {% if site.footer %}
      <div class="page__footer-follow">
        <ul class="social-icons">
          {% for link in site.footer %}
            <li><a href="{{ link.url }}" rel="nofollow noopener noreferrer">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
      </div>
    {% endif %}
    <div class="page__footer-copyright">&copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }}. {{ site.data.ui-text[site.locale].powered_by | default: "Powered by" }} <a href="https://jekyllrb.com" rel="nofollow">Jekyll</a> &amp; <a href="https://github.com/academicpages/academicpages.github.io">AcademicPages</a>.</div>
  </footer>
</div>
